<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Baby ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#0b1026,#29104d,#520f66);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.card{
width:90%;
max-width:700px;
padding:35px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:25px;
box-shadow:0 0 30px rgba(255,255,255,.15);
text-align:center;
position:relative;
z-index:10;
}

h1{
font-family:'Great Vibes',cursive;
font-size:65px;
color:#ffd4ea;
}

h2{
margin-top:10px;
font-size:32px;
}

#message{
margin-top:25px;
font-size:20px;
line-height:1.8;
min-height:180px;
}

button{
margin-top:25px;
padding:15px 40px;
font-size:18px;
border:none;
border-radius:40px;
background:#ff4f91;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

#loveLetter{
display:none;
margin-top:25px;
font-size:18px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="card">

<h1>Happy Birthday ❤️</h1>

<h2>My Baby ❤️</h2>

<div id="message"></div>

<button onclick="showLetter()">💖 Open My Heart 💖</button>

<div id="loveLetter"></div>

</div>

<script>
// ❤️ Love Letter (Typing Effect)

const text = `Happy Birthday My Baby ❤️

Pata hai... is duniya me hazaaron log hain, lekin meri zindagi ki sabse khoobsurat cheez tum ho. Aur shayad meri life ka sabse best decision ya sabse beautiful blessing ye hai ki tum meri life ka hissa ho.

Tum sirf meri girlfriend nahi ho... tum meri sukoon ho, meri smile ho, meri strength ho, aur meri har dua ka sabse khoobsurat jawab ho. ❤️

Kabhi kabhi sochta hoon ki maine aisa kya accha kiya tha jo mujhe tum jaisi caring, understanding aur itni pyari insaan mili. Sach me, thank you meri life me aane ke liye.

Aaj tumhare birthday par main bas itni si dua karta hoon ki tumhari smile kabhi kam na ho, tum hamesha healthy raho, khush raho, safe raho... aur jo bhi sapne tumhare dil me hain, woh ek din zaroor poore hon.

Aur jab bhi life mushkil lage... bas ek baat hamesha yaad rakhna—

Tum kabhi akeli nahi ho.

Main hamesha tumhare saath hoon...
Tumhari har khushi me,
Tumhare har struggle me,
Tumhari har jeet me,
Aur zarurat padi to tumhare har aansu ko muskurahat me badalne ki poori koshish karunga. ❤️

Thank you har us smile ke liye jo tumne mujhe di...
Har us memory ke liye jo humne saath banayi...
Aur har us pal ke liye jisme tumne meri life ko aur bhi beautiful bana diya.

Agar aaj main tumhe duniya ka sabse special gift de pata... to main tumhe bas itna dikhata ki meri nazron me tum kitni priceless aur kitni special ho.

Happy Birthday once again, My Baby. ❤️🎂

Main bas itna chahta hoon ki tum hamesha haste raho... kyunki tumhari smile meri duniya ki sabse pyari cheez hai.

No matter what happens, no matter where life takes us...

I'll always care for you, respect you, support you, and you'll always have a very special place in my heart. ❤️

Forever Yours,
Janu ❤️`;

let i = 0;

function typeWriter() {

if (i < text.length) {

document.getElementById("message").innerHTML += text.charAt(i);

i++;

setTimeout(typeWriter,35);

}

}

typeWriter();


// 💖 Open My Heart Button

function showLetter(){

document.getElementById("loveLetter").style.display="block";

document.getElementById("loveLetter").innerHTML=`

<h2 style="color:#ffd6ea;">My Baby ❤️</h2>

<p>

My Baby... ❤️

Agar kabhi tumhe ye lage ki duniya tumhare against hai, ya koi tumhe samajh nahi raha... bas ek baar meri taraf dekh lena.

Main promise karta hoon, main hamesha tumhare saath khada rahunga. ❤️

Mujhe tumse sirf pyaar hi nahi hai... mujhe tumhari har smile ki fikr hai, tumhari health ki fikr hai, tumhare sapno ki fikr hai, aur sabse zyada... tumhari khushi ki fikr hai.

Main perfect nahi hoon, galtiyan mujhse bhi hongi... lekin ek cheez kabhi nahi badlegi—

Mera care, mera respect aur meri feelings tumhare liye. ❤️

Main har din bas itna chahta hoon ki tum bina kisi tension ke muskurao... kyunki tumhari smile meri favourite feeling hai.

Aur agar kabhi tum thak jao, toot jao, ya sirf chup rehna chaho... to yaad rakhna, tumhe sab kuch akele nahi sehna hai. Main tumhara saath dene ki poori koshish karunga.

Thank you meri life me aane ke liye, mujhe samajhne ke liye, aur meri life ko itna beautiful banane ke liye.

I don't know what the future holds... but as long as I'm with you, I'll always try to make you feel loved, respected, safe and important.

❤️ I Love You My Baby.

You are, and always will be, one of the most precious parts of my life.

I Love You. Forever. ❤️

<br><br>

Happy Birthday once again,

My Baby ❤️

</p>

`;

}
// 🌙 Moon

const moon = document.createElement("div");

moon.style.position = "fixed";
moon.style.top = "60px";
moon.style.right = "70px";
moon.style.width = "120px";
moon.style.height = "120px";
moon.style.borderRadius = "50%";
moon.style.background = "#fff8d6";
moon.style.boxShadow = "0 0 60px white";
moon.style.zIndex = "-1";

document.body.appendChild(moon);


// ⭐ Stars

for(let i=0;i<250;i++){

let star=document.createElement("div");

star.style.position="fixed";

star.style.width="2px";

star.style.height="2px";

star.style.borderRadius="50%";

star.style.background="white";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

star.style.opacity=Math.random();

star.style.animation=`twinkle ${2+Math.random()*3}s infinite`;

document.body.appendChild(star);

}


// ❤️ Hearts

setInterval(()=>{

let heart=document.createElement("div");

heart.innerHTML="❤️";

heart.style.position="fixed";

heart.style.left=Math.random()*100+"vw";

heart.style.top="-30px";

heart.style.fontSize=(18+Math.random()*20)+"px";

heart.style.animation="fall 6s linear";

heart.style.pointerEvents="none";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

},300);


// 🌹 Roses

setInterval(()=>{

let rose=document.createElement("div");

rose.innerHTML="🌹";

rose.style.position="fixed";

rose.style.left=Math.random()*100+"vw";

rose.style.top="-30px";

rose.style.fontSize=(18+Math.random()*15)+"px";

rose.style.animation="fall 8s linear";

rose.style.pointerEvents="none";

document.body.appendChild(rose);

setTimeout(()=>rose.remove(),8000);

},700);


// CSS Animation

const style=document.createElement("style");

style.innerHTML=`

@keyframes twinkle{

0%{opacity:.2;}

50%{opacity:1;}

100%{opacity:.2;}

}

@keyframes fall{

0%{

transform:translateY(-50px);

}

100%{

transform:translateY(110vh);

}

}

`;

document.head.appendChild(style);
// 📸 Photo Frame

const photo = document.createElement("img");

photo.src = "photo.jpg";   // Is naam se photo rakhna

photo.style.width = "220px";
photo.style.height = "220px";
photo.style.borderRadius = "20px";
photo.style.objectFit = "cover";
photo.style.border = "4px solid white";
photo.style.marginTop = "25px";
photo.style.boxShadow = "0 0 25px pink";

document.querySelector(".card").appendChild(photo);


// 🎆 Fireworks

function fireworks(){

for(let i=0;i<80;i++){

let f=document.createElement("div");

f.style.position="fixed";

f.style.left="50%";
f.style.top="50%";

f.style.width="8px";
f.style.height="8px";

f.style.borderRadius="50%";

f.style.background=`hsl(${Math.random()*360},100%,60%)`;

document.body.appendChild(f);

let angle=Math.random()*Math.PI*2;

let distance=80+Math.random()*180;

f.animate([

{transform:"translate(0,0)",opacity:1},

{transform:`translate(${Math.cos(angle)*distance}px,${Math.sin(angle)*distance}px)`,opacity:0}

],{

duration:1800

});

setTimeout(()=>f.remove(),1800);

}

}

setTimeout(fireworks,1500);


// ❤️ Closig
</script>
<audio id="bgmusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click", function () {
    document.getElementById("bgmusic").play();
}, { once: true });
</script>

</body>

</html>01:16 30-07-2026
